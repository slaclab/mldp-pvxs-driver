services:
  devcontainer:
    # Built by initializeCommand (see docker-compose.devcontainer.build.yml).
    image: mldp-pvxs-driver-devcontainer:local
    volumes:
      - .:/workspace:cached
    command: sleep infinity
    # Allow debugging (gdb/lldb) inside the container
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - default
    # Allow the dev container to access the other services
    depends_on:
      - mongodb
      - dp-ingestion
      - dp-annotation

networks:
  default:
    name: mldp_network
