# TLS secret template — fill in base64-encoded certs before applying.
# Generate: kubectl create secret generic mldp-pvxs-tls \
#   --from-file=client.crt=./client.crt \
#   --from-file=client.key=./client.key \
#   --from-file=ca.crt=./ca.crt \
#   -n mldp-pvxs --dry-run=client -o yaml > kubernetes/secret-tls.yaml
#
# DO NOT commit real certs. Use sealed-secrets, Vault, or external-secrets-operator.
apiVersion: v1
kind: Secret
metadata:
  name: mldp-pvxs-tls
  namespace: mldp-pvxs
  labels:
    app.kubernetes.io/name: mldp-pvxs-driver
type: Opaque
data:
  client.crt: <base64-encoded-cert>
  client.key: <base64-encoded-key>
  ca.crt: <base64-encoded-ca>
