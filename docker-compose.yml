services:
  mongodb:
    # mongo >= 8.0.34 refuses to start on host kernel >= 6.19 (GH runners: 7.0.x), SERVER-121912
    image: mongo:8.0.32
    restart: on-failure
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    # ports:
    #   - "27017:27017"

  dp-ingestion:
    image: ghcr.io/slaclab/dp-service:rel-1.16.0
    container_name: dp-ingestion
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - "java"
    environment:
      - DP_MONGO_DB_URI=mongodb://admin:admin@mongodb:27017/dp?authSource=admin
    command:
      - "-cp"
      - "/app/app.jar"
      - "com.ospreydcs.dp.service.ingest.server.IngestionGrpcServer"
    # ports:
    #   - "50051:50051"
  
  dp-query:
    image: ghcr.io/slaclab/dp-service:rel-1.16.0
    container_name: dp-query
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - "java"
    environment:
      - DP_MONGO_DB_URI=mongodb://admin:admin@mongodb:27017/dp?authSource=admin
    command:
        - "-Ddp.MongoClient.dbHost=mongodb"
        - "-Ddp.MongoClient.dbPort=27017"
        - "-Ddp.MongoClient.dbUser=admin"
        - "-Ddp.MongoClient.dbPassword=admin"
        - "-Ddp.GrpcClient.hostname=dp-ingestion"
        - "-Ddp.IngestionServer.port=50052"
        - "-cp"
        - "/app/app.jar"
        - "com.ospreydcs.dp.service.query.server.QueryGrpcServer"
    # ports:
    #   - "50052:50052"

  dp-annotation:
    image: ghcr.io/slaclab/dp-service:rel-1.16.0
    container_name: dp-annotation
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - "java"
    environment:
      - DP_MONGO_DB_URI=mongodb://admin:admin@mongodb:27017/dp?authSource=admin
    command:
      - "-cp"
      - "/app/app.jar"
      - "com.ospreydcs.dp.service.annotation.server.AnnotationGrpcServer"
    # ports:
    #   - "50053:50053"

volumes:
  kafka-data:
